# XcodeGen spec. Generate with: brew install xcodegen && cd ios/Recall && xcodegen generate
name: Recall
options:
  bundleIdPrefix: com.recall
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your own team in Xcode (Signing & Capabilities). Not committed.
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config/Recall.xcconfig
  Release: Config/Recall.xcconfig
targets:
  Recall:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["**/.gitkeep", "**/README.md"]
      # Gitignored, produced by ml/conversion/install_models.sh. Optional so the build works when absent.
      # Xcode compiles the .mlpackage files into <model>.mlmodelc at the bundle root; model_config.json (if any) names them.
      - path: Resources/Models
        optional: true
        excludes: ["**/.gitkeep"]
      - path: Resources/Tokenizer
        optional: true
        excludes: ["**/.gitkeep"]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Recall
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Connects to the Navigator robot
        NSCameraUsageDescription: Sees the room to find objects
        NSMicrophoneUsageDescription: Listens for voice commands
        NSSpeechRecognitionUsageDescription: Understands voice commands
        NSNearbyInteractionUsageDescription: Measures the distance to your phone so the robot can come to you
        NSLocalNetworkUsageDescription: Talks to the Recall companion app on your iPhone
        NSBonjourServices: ["_recall-ni._tcp", "_recall-ni._udp"]
        GEMINI_API_KEY: $(GEMINI_API_KEY)
        GEMINI_MODEL: $(GEMINI_MODEL)
        BACKEND_BASE_URL: $(BACKEND_BASE_URL)
        RECALL_TOKEN: $(RECALL_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recall.app
        COREML_CODEGEN_LANGUAGE: None   # we load the models by name; skip generated Swift model classes
  RecallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["**/.gitkeep"]
      - path: Sources/DriveLink/DriveLinkProtocol.swift
      - path: Sources/Pose/PoseMath.swift
      - path: Sources/ObstacleGuard
        excludes: ["DepthAdapter.swift", "README.md"]
      - path: Sources/Controller/ControllerMath.swift
      - path: Sources/Controller/Controller.swift
      - path: Sources/SelfTest/SelfTestTypes.swift
      - path: Sources/SelfTest/SelfTestMetrics.swift
      - path: Sources/SelfTest/SelfTestSteps.swift
      - path: Sources/SelfTest/SelfTestEngine.swift
      - path: Sources/Shared
      - path: Sources/Memory
      - path: Sources/OccupancyGrid
        excludes: ["README.md"]
      - path: Sources/Planner
      - path: Sources/Retrieval
      - path: Sources/FindExecutor
      - path: Sources/EvalMode
      - path: Sources/MLEncoders
        excludes: ["README.md"]
      - path: Sources/Sync
        excludes: ["README.md"]
      - path: Sources/Perception
        excludes: ["PerceptionAdapters.swift", "README.md"]
      - path: Sources/Explore
        excludes: ["README.md"]
      - path: Sources/Speech/SpeechTypes.swift
      - path: Sources/Speech/SpeechFakes.swift
      - path: Sources/UI/FindBarViewModel.swift
      - path: Sources/UI/ToolExecuting.swift
      - path: Sources/ComeToMe/CompanionMessages.swift
      - path: Sources/ComeToMe/ApproachPlanner.swift
      - path: Sources/ComeToMe/ComeToMeRunner.swift
      - path: Sources/ComeToMe/RangeSample.swift
      - path: Sources/Coordinator
      - path: Sources/Teach/WaypointStore.swift
      - path: Sources/Teach/WorldMapStore.swift
      - path: Sources/Teach/RelocalizationMonitor.swift
      - path: Sources/Teach/TeachViewModel.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Companion:
    type: application
    platform: iOS
    sources:
      - path: ../Companion/Sources
      - path: Sources/ComeToMe/CompanionMessages.swift
      - path: Sources/ComeToMe/CompanionLink.swift
      - path: Sources/ComeToMe/NIRanging.swift
      - path: Sources/ComeToMe/RangeSample.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recall.companion
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: ../Companion/Resources/Info.plist
