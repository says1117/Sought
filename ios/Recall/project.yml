# XcodeGen spec. Generate with: brew install xcodegen && cd ios/Recall && xcodegen generate
name: Recall
options:
  bundleIdPrefix: com.recall
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your own team in Xcode (Signing & Capabilities). Not committed.
    CODE_SIGN_STYLE: Automatic
targets:
  Recall:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["**/.gitkeep"]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Recall
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Connects to the Navigator robot
        NSCameraUsageDescription: Sees the room to find objects
        NSMicrophoneUsageDescription: Listens for voice commands
        NSSpeechRecognitionUsageDescription: Understands voice commands
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recall.app
  RecallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["**/.gitkeep"]
      - path: Sources/DriveLink/DriveLinkProtocol.swift
      - path: Sources/Pose/PoseMath.swift
      - path: Sources/ObstacleGuard
        excludes: ["DepthAdapter.swift", "README.md"]
      - path: Sources/Controller/ControllerMath.swift
      - path: Sources/Controller/Controller.swift
      - path: Sources/SelfTest/SelfTestTypes.swift
      - path: Sources/SelfTest/SelfTestMetrics.swift
      - path: Sources/SelfTest/SelfTestSteps.swift
      - path: Sources/SelfTest/SelfTestEngine.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
